[workspace]
resolver = "2"
members = ["crates/types", "crates/engine", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
garde = { version = "0.22", features = ["derive", "serde"] }

[profile.release]
lto = "thin"
strip = true
