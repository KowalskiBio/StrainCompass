# Production vhost for bactiment, served at sc.ubch.sci.muni.cz.
#
# That hostname is a CNAME to oligool.biochem.muni.cz -> 147.251.22.180,
# created 2026-09-15 (this is the name that was actually requested from
# and granted by the faculty DNS admin; earlier notes in this repo guessed
# "bactiment.ubch.sci.muni.cz", which was never requested and does not exist).
#
# certbot --nginx rewrites this file in place to add the TLS server block
# and the 80 -> 443 redirect, exactly as it did for the sibling sites.
#
# New file, not a default_server, matches one server_name only, so
# biocal / oligool / primerool are untouched (deployment.md rule 2).

server {
    listen 80;
    listen [::]:80;
    server_name sc.ubch.sci.muni.cz;

    location / {
        # 127.0.0.1, not "localhost": localhost can resolve to ::1 first and
        # the app listens on IPv4 only, which would be an intermittent 502.
        proxy_pass http://127.0.0.1:8010;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 600m;    # matches the app's 600 MB upload limit

        # genome comparison runs are polled, not streamed, but uploads of
        # large FASTAs still need a generous window
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_request_buffering off;
    }
}
