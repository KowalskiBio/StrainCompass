# Temporary IP-based access for straincompass. Serves http://147.251.22.180/ only.
#
# SUPERSEDED (2026-09-15): the real hostname sc.ubch.sci.muni.cz now exists,
# so deploy/nginx-straincompass.conf is the vhost to install. Keep this file only
# as the fallback if the hostname or its certificate ever has to be backed out.
#
# Safe next to the other sites: it is a NEW file, it is not a
# default_server, and it matches only the literal IP in the Host header,
# so biocal / oligool / primerool keep their own vhosts untouched.

server {
    listen 80;
    listen [::]:80;
    server_name 147.251.22.180;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 600m;    # matches the app's 600 MB upload limit

        # genome comparison runs are polled, not streamed, but uploads of
        # large FASTAs still need a generous window
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_request_buffering off;
    }
}
